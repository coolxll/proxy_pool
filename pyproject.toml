[project]
name = "proxy-pool-local"
version = "2.4.0+integrated.202607"
requires-python = ">=3.10"

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: 需要外部服务（如 Redis）的集成测试",
]

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "docs/*",
    "setup.py",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
